<h1 id="應用系統角色說明">應用系統角色說明</h1>
<p><strong>應用系統角色區分為以下:</strong></p>
<table>
<thead>
<tr class="header">
<th><strong>管理員</strong></th>
<th><strong>具備所有系統設定的權限，除了稽核管理。</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>稽核員</strong></td>
<td><strong>具備稽核管理之相關權限(ex: 稽核調閱、關鍵字設定等)</strong></td>
</tr>
<tr class="even">
<td><strong>使用者</strong></td>
<td><strong>一般使用者，可查詢個人的列印紀錄。</strong></td>
</tr>
<tr class="odd">
<td><strong>稽核管理員</strong></td>
<td><strong>具備稽核管理之相關權限(ex: 稽核調閱、關鍵字設定等)</strong> <br> <strong>管理稽核員(ex: 指定稽核範圍、雙認證規則等)</strong></td>
</tr>
<tr class="even">
<td><strong>支援</strong></td>
<td><strong>可以使用事務性功能(ex: 報表管理)</strong></td>
</tr>
</tbody>
</table>
