<h1 id="關鍵字維護">關鍵字維護</h1>
<p><strong>關鍵字分類設定、新增關鍵字</strong></p>
<p><a href="http://124.218.37.90/html/tw/images/AD0006/image118.png"><img src="http://124.218.37.90/html/tw/images/AD0006/image118.png" alt="image" /></a></p>
<p><strong>關鍵字分類設定：可依據不同分類設定關鍵字、與部門進行檢核。</strong></p>
<p><a href="http://124.218.37.90/html/tw/images/AD0006/image119.png"><img src="http://124.218.37.90/html/tw/images/AD0006/image119.png" alt="image" /></a></p>
<p><strong>關鍵字分類修改維護 [編輯圖示]</strong></p>
<p><a href="http://124.218.37.90/html/tw/images/AD0006/image120.png"><img src="http://124.218.37.90/html/tw/images/AD0006/image120.png" alt="image" /></a></p>
<p><strong>新增關鍵字：關鍵字分類下可設定不同關鍵字、分數、計數規則。</strong></p>
<p><a href="http://124.218.37.90/html/tw/images/AD0006/image121.png"><img src="http://124.218.37.90/html/tw/images/AD0006/image121.png" alt="image" /></a></p>
<p><strong>累計: 若設定為Y，表示風險分數 = 關鍵字出現次數N * 分數</strong></p>
<p><strong>正規表示式: 若設定為 Y，表示關鍵字以正規表示式來偵測，以下為兩個案例:</strong></p>
<p><strong>身分證號: [A-Z][12]\d{8}</strong></p>
<p><strong>手機門號: 09\d{8}</strong></p>
<p><strong>修改關鍵字：選擇要修改的關鍵字，點擊 [編輯圖示]</strong> <strong>直接進行編輯。</strong></p>
<p><a href="http://124.218.37.90/html/tw/images/AD0006/image122.png"><img src="http://124.218.37.90/html/tw/images/AD0006/image122.png" alt="image" /></a></p>
