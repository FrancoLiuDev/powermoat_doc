<h1 id="部門啟用審核及設定部門審核者">部門啟用審核及設定部門審核者</h1>
<p><a href="http://124.218.37.90/html/doc/images/PRTAD0002/image148.png"><img src="http://124.218.37.90/html/doc/images/PRTAD0002/image148.png" alt="image" /></a></p>
<p>啟用文件審核時，此部門的人員之列印作業皆需要進行審核。</p>
<p>審核者及審核者代理人須為此部門的人員。當有人員之列印作業需要進行審核時，系統會發送通知信件至審核者及審核者代理人。</p>
