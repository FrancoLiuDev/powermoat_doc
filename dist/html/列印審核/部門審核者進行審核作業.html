<h1 id="部門審核者進行審核作業">部門審核者進行審核作業</h1>
<p><a href="http://124.218.37.90/html/doc/images/PRTAD0004/image150.png"><img src="http://124.218.37.90/html/doc/images/PRTAD0004/image150.png" alt="image" /></a></p>
<p>審核者登入系統後，於個人儀表板頁面可以查看待審核的文件清單。</p>
<p>可進行單筆審核或勾選多筆進行批次審核。</p>
<p>可點選連結進入文件詳細頁面進行文件內容查閱。</p>
<p><a href="http://124.218.37.90/html/doc/images/PRTAD0004/image151.png"><img src="http://124.218.37.90/html/doc/images/PRTAD0004/image151.png" alt="image" /></a></p>
<p>文件審核必須輸入審核意見。</p>
<p><a href="http://124.218.37.90/html/doc/images/PRTAD0004/image152.png"><img src="http://124.218.37.90/html/doc/images/PRTAD0004/image152.png" alt="image" /></a></p>
<p>可進行文件內容影像瀏覽後再進行審核作業。</p>
