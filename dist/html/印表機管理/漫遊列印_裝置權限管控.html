<h1 id="漫遊列印裝置權限管控">漫遊列印/裝置權限管控</h1>
<p><a href="http://124.218.37.90/html/doc/images/PRT0003/image107.png"><img src="http://124.218.37.90/html/doc/images/PRT0003/image107.png" alt="image" /></a></p>
<p>4.1 設定漫遊列印之虛擬印表機(共用)，End User只需要安裝單一的印表機即可。</p>
<p><a href="http://124.218.37.90/html/doc/images/PRT0003/image108.png"><img src="http://124.218.37.90/html/doc/images/PRT0003/image108.png" alt="image" /></a></p>
<p>4.2 將管制佇列列印啟用，通過此印表機的列印工作將暫存於伺服器上，等待使用者至任一裝置上進行授權認證取件。</p>
<p><a href="http://124.218.37.90/html/doc/images/PRT0003/image109.png"><img src="http://124.218.37.90/html/doc/images/PRT0003/image109.png" alt="image" /></a></p>
<p>4.3 設定實體印表機，裝置對應至實體裝置。</p>
<p><a href="http://124.218.37.90/html/doc/images/PRT0003/image110.png"><img src="http://124.218.37.90/html/doc/images/PRT0003/image110.png" alt="image" /></a></p>
<p>管制佇列列印需取消。</p>
