ventDefault(); return false; }); // 禁用複製 document.addEventListener('copy', function(e) { e.preventDefault(); return false; }); // 防止拖曳 document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }); // 添加浮水印 window.addEventListener('load', function() { var watermark = document.createElement('div'); watermark.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;opacity:0.1;font-size:50px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;color:#000;'; watermark.textContent = '僅供閱讀 - 請勿修改'; document.body.appendChild(watermark); }); </script> <style> body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } </style> </head> <body> <div class="container"> <div class="header"> <h1>📚 PSS 專案文件</h1> <p>選擇您要查看的文件</p> </div> <div class="card-grid"> <a href="專案功能清單.html" class="card"> <div class="card-icon">📄</div> <div class="card-title">專案功能清單</div> <div class="card-description">點擊查看文件內容</div> </a> <a href="專案功能清單 1.html" class="card"> <div class="card-icon">📋</div> <div class="card-title">專案功能清單 1</div> <div class="card-description">點擊查看文件內容</div> </a> </div> <div class="footer"> <p>© 2025 專案文件系統</p> </div> </div> </body> </html>
